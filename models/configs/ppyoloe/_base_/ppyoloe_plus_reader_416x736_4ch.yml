worker_num: 4
eval_height: &eval_height 416
eval_width: &eval_width 736
eval_size: &eval_size [*eval_height, *eval_width]

TrainReader:
  sample_transforms:
    - DecodeWithAux: {}
    - RandomDistort: {}
    - RandomFlipWithAux: {}
  batch_transforms:
    - BatchRandomResizeWithAux: {target_size: [[320, 576], [352, 640], [384, 672], [416, 736], [448, 800], [480, 864]], random_size: True, random_interp: True, keep_ratio: False}
    - ConcatAuxChannel: {scale_aux: false}
    - NormalizeImage: {mean: [0., 0., 0., 0.], std: [1., 1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}
  batch_size: 8
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true

EvalReader:
  sample_transforms:
    - DecodeWithAux: {}
    - ResizeWithAux: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - ConcatAuxChannel: {scale_aux: false}
    - NormalizeImage: {mean: [0., 0., 0., 0.], std: [1., 1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 2

TestReader:
  inputs_def:
    image_shape: [4, *eval_height, *eval_width]
  sample_transforms:
    - DecodeWithAux: {}
    - ResizeWithAux: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - ConcatAuxChannel: {scale_aux: false}
    - NormalizeImage: {mean: [0., 0., 0., 0.], std: [1., 1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
